# Checkov configuration for Bill Shock Guard
# Architectural decisions for near-zero cost are explicitly documented per Section 9.3.
# All skips are justified: this tool exists to avoid surprise costs, so it avoids paid services like KMS CMKs and NAT gateways.

skip-check:
  # CKV_AWS_116: Ensure that AWS Lambda function is configured for a Dead Letter Queue(DLQ)
  # Justification: SNS alert on Lambda errors (CloudWatch alarm) is used; dedicated DLQ/SQS adds unnecessary complexity and cost.
  - CKV_AWS_116

  # CKV_AWS_117: Ensure that AWS Lambda function is configured inside a VPC
  # Justification: Placing Lambda in VPC requires NAT Gateway or VPC endpoints, causing significant monthly charges (~$32+/month).
  - CKV_AWS_117

  # CKV_AWS_119: Ensure DynamoDB Tables are encrypted using a KMS Customer Managed Key
  # Justification: AWS KMS Customer Managed Keys cost $1/key/month; default AWS-managed encryption is used to keep cost $0.
  - CKV_AWS_119

  # CKV_AWS_28: Ensure DynamoDB point-in-time recovery (PITR) is enabled
  # Justification: DynamoDB PITR costs extra; state is ephemeral tracking state with 30-day TTL.
  - CKV_AWS_28

  # CKV_AWS_26: Ensure all data stored in SNS topic is encrypted
  # Justification: KMS CMK for SNS costs $1/key/month; default encryption keeps guard $0 cost.
  - CKV_AWS_26

  # CKV_AWS_173: Check Lambda environment variable is encrypted using KMS CMK
  # Justification: BSG_CONFIG contains only non-secret configuration; secrets (Telegram token) are stored in SSM Parameter Store. KMS CMK costs $1/month.
  - CKV_AWS_173

  # CKV_AWS_158: Ensure that CloudWatch Log Group is encrypted by KMS
  # Justification: CloudWatch Log Group uses AWS-managed encryption. Customer Managed KMS Keys cost $1/month; this tool exists to avoid surprise cost.
  - CKV_AWS_158

  # CKV_AWS_50: Ensure X-Ray tracing is enabled for Lambda
  # Justification: AWS X-Ray tracing adds unnecessary cost and complexity for a periodic batch scanner running 4 times per day.
  - CKV_AWS_50

  # CKV_AWS_272: Ensure AWS Lambda function code is signed
  # Justification: AWS Signer code signing adds unnecessary setup overhead and friction for self-hosted students without adding security in this threat model.
  - CKV_AWS_272

  # CKV_AWS_189: Ensure EBS volume is encrypted with KMS CMK
  # Justification: KMS CMK costs $1/key/month; default AWS-managed encryption keeps cost $0.
  - CKV_AWS_189

  # CKV_AWS_356: Ensure no IAM policies allow "*" resource with actions that support resource-level permissions
  # Justification: AWS EC2 Describe* APIs and EC2 Stop/Release APIs require Resource "*"; DynamoDB, SNS, SSM, and CloudWatch logs are strictly scoped.
  - CKV_AWS_356

  # CKV_AWS_111: Ensure IAM policies does not allow write access without constraints
  # Justification: Mutating actions are strictly generated from enabled_actions and denied on protected resources with aws:ResourceTag.
  - CKV_AWS_111

  # CKV_AWS_150: Ensure that Load Balancer has deletion protection enabled
  # Justification: Test-fixtures ALB is deliberately temporary and disposable for idle detection testing; deletion protection prevents teardown.
  - CKV_AWS_150

  # CKV_AWS_91: Ensure the ELBv2 has access logging enabled
  # Justification: Test-fixtures ALB has zero listeners/targets and S3 access logging adds storage cost.
  - CKV_AWS_91

  # CKV_AWS_131: Ensure that ALB drops HTTP headers
  # Justification: Test-fixtures ALB is an idle test fixture without listeners.
  - CKV_AWS_131

  # CKV_AWS_2: Ensure ALB redirects HTTP to HTTPS
  # Justification: Test-fixtures ALB has zero listeners and is strictly an idle test fixture.
  - CKV_AWS_2

  # CKV_AWS_79: Ensure Instance Metadata Service Version 1 is not enabled
  # Justification: Test-fixtures EC2 is a disposable idle instance with no IAM role attached and is immediately torn down.
  - CKV_AWS_79

  # CKV_AWS_8: Ensure EC2 instance is configured with launch template
  # Justification: Test-fixtures EC2 is an idle test fixture created directly to verify idle detector.
  - CKV_AWS_8

  # CKV_AWS_135: Ensure EBS volume is encrypted
  # Justification: Test-fixtures EBS volume is a disposable 1 GiB volume for idle detection testing.
  - CKV_AWS_135
