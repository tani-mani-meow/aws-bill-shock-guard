[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bill-shock-guard"
version = "0.1.0"
description = "A lightweight open-source tool that stops students from getting surprise AWS bills."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tanishq Ingawale" }
]
keywords = ["aws", "cloud", "cost-optimization", "guard", "finops", "student"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "moto[all]>=5.0.0",
    "hypothesis>=6.90.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
bsg = "bill_shock_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bill_shock_guard"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "bill_shock_guard.models",
    "bill_shock_guard.config",
    "bill_shock_guard.protection",
    "bill_shock_guard.interfaces",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
addopts = "-q"
